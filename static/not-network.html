<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaf — Нет подключения</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:#0c0c0c;color:#f5f5f5;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}

.offline-card{
  text-align:center;
  max-width:400px;
  padding:2.5rem;
  background:rgba(22,22,22,0.65);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:1.25rem;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

.icon-wrap{
  width:5rem;height:5rem;margin:0 auto 1.5rem;
  border-radius:50%;
  background:linear-gradient(135deg,rgba(239,68,68,0.15),rgba(239,68,68,0.05));
  display:flex;align-items:center;justify-content:center;
}
.icon-wrap svg{width:2.5rem;height:2.5rem;color:#ef4444;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

h1{font-family:'Space Grotesk','Inter',sans-serif;font-size:1.5rem;font-weight:700;margin-bottom:.5rem}
p.sub{color:#6b6b6b;font-size:.9rem;margin-bottom:1.5rem;line-height:1.5}

.cached-section{margin-top:1.5rem;border-top:1px solid rgba(255,255,255,0.06);padding-top:1.25rem}
.cached-title{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#6b6b6b;margin-bottom:.75rem}
#cached-list{display:flex;flex-direction:column;gap:.25rem}
.empty-cache{color:#6b6b6b;font-size:.85rem;padding:1rem 0}

.cached-track{
  display:flex;align-items:center;gap:.75rem;
  padding:.5rem .65rem;border-radius:.6rem;
  cursor:pointer;transition:all .15s ease;
  text-align:left;width:100%;
  background:none;border:none;color:inherit;font-family:inherit;
}
.cached-track:hover{background:rgba(128,128,128,0.08)}
.cached-track img{width:2.25rem;height:2.25rem;border-radius:.4rem;object-fit:cover;flex-shrink:0;background:#27272a}
.cached-track .meta{flex:1;min-width:0}
.cached-track .meta .title{font-size:.85rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cached-track .meta .artist{font-size:.7rem;color:#6b6b6b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.retry-btn{
  margin-top:1.25rem;padding:.65rem 1.5rem;
  border-radius:999px;border:none;cursor:pointer;
  background:#22c55e;color:#08130b;font-size:.9rem;font-weight:600;
  transition:background .15s;
}
.retry-btn:hover{background:#1ea34f}

.fade-in{animation:fadeIn .5s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div class="offline-card fade-in">
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24">
      <path d="M1 1l22 22"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
  </div>
  <h1>Нет подключения к интернету</h1>
  <p class="sub">Проверьте сетевое соединение и попробуйте снова.<br>Скачанные треки доступны офлайн.</p>

  <div class="cached-section">
    <p class="cached-title">Офлайн треки</p>
    <div id="cached-list">
      <p class="empty-cache">Пока нет скачанных треков</p>
    </div>
  </div>

  <button class="retry-btn" id="retry-btn">Повторить подключение</button>
</div>

<script>
(function(){
  const DEFAULT_COVER = 'data:image/svg+xml,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">' +
    '<rect width="200" height="200" fill="#27272a"/>' +
    '<path d="M120 55v70a22 22 0 1 1-10-18V70l-40 10v58a22 22 0 1 1-10-18V60l60-15z" fill="rgba(255,255,255,0.35)"/>' +
    '</svg>'
  );

  function loadCachedTracks() {
    try {
      const raw = localStorage.getItem('leaf-cached-tracks');
      return raw ? JSON.parse(raw) : [];
    } catch(e) { return []; }
  }

  function renderCached() {
    const list = document.getElementById('cached-list');
    const tracks = loadCachedTracks();
    if (!tracks.length) {
      list.innerHTML = '<p class="empty-cache">Пока нет скачанных треков</p>';
      return;
    }
    list.innerHTML = tracks.map(function(tr) {
      return '<button class="cached-track" data-src="' + (tr.streamSrc || '').replace(/"/g, '&quot;') + '">' +
        '<img src="' + (tr.cover || DEFAULT_COVER) + '" alt="" />' +
        '<div class="meta">' +
          '<div class="title">' + (tr.title || 'Без названия') + '</div>' +
          '<div class="artist">' + (tr.artist || 'Неизвестный') + '</div>' +
        '</div>' +
      '</button>';
    }).join('');

    list.querySelectorAll('.cached-track').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var src = btn.getAttribute('data-src');
        if (src) window.location.href = '/stream?url=' + encodeURIComponent(src);
      });
    });
  }

  renderCached();

  document.getElementById('retry-btn').addEventListener('click', function() {
    window.location.reload();
  });

  // Auto-retry connectivity check
  setInterval(function() {
    fetch('/api/telemetry/status', { method: 'HEAD', cache: 'no-store' })
      .then(function() { window.location.reload(); })
      .catch(function() {});
  }, 5000);
})();
</script>
</body>
</html>
